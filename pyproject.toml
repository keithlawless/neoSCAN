[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neo-scan"
version = "1.4.4"
description = "Cross-platform desktop app for programming Uniden radio scanners"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "pyserial>=3.5",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]
sdr = [
    "pyrtlsdr>=0.2.93",   # optional: cleaner RTL-SDR device enumeration
]

[project.scripts]
neo-scan = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
